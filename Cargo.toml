[package]
name = "rsmultigit"
version = "0.1.64"
edition = "2024"
authors = ["Mark Veltzer <mark.veltzer@gmail.com>"]
description = "Manage multiple git repositories at once"
license = "MIT"
repository = "https://github.com/veltzer/rsmultigit"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
# vendored-openssl unconditionally: the canonical ci.yml builds every target
# with a plain `cargo build --release`, and the aarch64 cross build cannot
# link the runner's x86_64 libssl.
git2 = { version = "0.21", features = ["vendored-openssl"] }
glob = "0.3"
anyhow = "1"
anstream = "1"
regex-lite = "0.1"
serde = { version = "1", features = ["derive"] }
toml = "1"
sha2 = "0.10"
shellexpand = "3"
similar = "3"
camino = "1"
indicatif = "0.18"
inquire = "0.9"
# No default features: those add JWT (GitHub App auth, which we do not use)
# on aws-lc-rs, a C/CMake build that would burden the aarch64 cross build.
# What is left: hyper client, rustls on ring, redirects, retries, timeouts.
octocrab = { version = "0.54", default-features = false, features = [
    "default-client",
    "follow-redirect",
    "retry",
    "rustls",
    "rustls-ring",
    "timeout",
] }
serde_json = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

# Dev builds favour compile speed: line tables keep file:line in backtraces
# at a fraction of full debug info's link cost, and dependencies get light
# optimization once (they rarely change) so tests run faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

# Everyday release builds: thin LTO keeps most of the gain while using every
# core. The fully optimized binary is the dist profile below.
[profile.release]
strip = true
lto = "thin"

# What ships: CI's release job builds this (`cargo build --profile dist`).
# Fat LTO with one codegen unit is slow to build and only worth it here.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
